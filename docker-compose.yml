version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: urbanbites-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  backend:
    build:
      context: ./UrbanBitesBackend
      dockerfile: Dockerfile
    container_name: urbanbites-backend
    ports:
      - "8081:10000"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/urbanbites
      - PORT=10000
      # External dependencies can be configured here:
      # - RAZORPAY_KEY_ID=your_key
      # - RAZORPAY_KEY_SECRET=your_secret
    depends_on:
      - mongodb
    restart: unless-stopped

  frontend:
    build:
      context: ./UrbanBites
      dockerfile: Dockerfile
      args:
        # Assuming the backend is exposed on port 8081 on the host machine
        - VITE_API_BASE_URL=http://localhost:8081
    container_name: urbanbites-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongodb_data:
