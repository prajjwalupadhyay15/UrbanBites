<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UrbanBites Approval Update</title>
</head>
<body style="margin:0;padding:0;background:#f4f6fb;font-family:Arial,sans-serif;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4f6fb;padding:24px 0;">
    <tr>
        <td align="center">
            <table role="presentation" width="600" cellspacing="0" cellpadding="0" style="max-width:600px;background:#ffffff;border-radius:16px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,0.08);">
                <tr>
                    <td style="background:linear-gradient(135deg,#16a34a,#22c55e);padding:24px;color:#ffffff;">
                        <h1 style="margin:0;font-size:24px;">UrbanBites</h1>
                        <p style="margin:8px 0 0 0;font-size:14px;opacity:0.95;">Account Approval Update</p>
                    </td>
                </tr>
                <tr>
                    <td style="padding:28px;">
                        <p style="margin:0 0 12px 0;font-size:16px;color:#222;">Hi {{name}},</p>
                        <h2 style="margin:0 0 10px 0;font-size:20px;color:#111827;">{{title}}</h2>
                        <p style="margin:0 0 20px 0;font-size:14px;color:#4b5563;line-height:1.7;">{{message}}</p>
                        
                        <div style="background:#f9fafb;border-radius:12px;padding:16px;border:1px solid #e5e7eb;">
                            <p style="margin:0;font-size:12px;color:#6b7280;text-transform:uppercase;letter-spacing:0.05em;font-weight:bold;">Details</p>
                            <p style="margin:4px 0 0 0;font-size:14px;color:#374151;">{{referenceLabel}}</p>
                        </div>
                        
                        <p style="margin:24px 0 0 0;font-size:13px;color:#9ca3af;line-height:1.5;">
                            If you have any questions regarding this update, please contact our support team.
                        </p>
                    </td>
                </tr>
                <tr>
                    <td style="background:#f9fafb;padding:16px 28px;border-top:1px solid #f3f4f6;text-align:center;">
                        <p style="margin:0;font-size:12px;color:#9ca3af;">&copy; 2026 UrbanBites. All rights reserved.</p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
